[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-mappo"
version = "0.1.0"
description = "Educational Multi-Agent PPO in a cooperative GridWorld"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "jsonschema>=4.18",
]

[tool.setuptools.packages.find]
where = ["src"]
